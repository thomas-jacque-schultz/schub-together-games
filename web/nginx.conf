# Purement statique : le tunnel envoie /ws au relais (schub-together-games) et le reste ici.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Seul PremadeLab intègre les jeux en iframe ; ouverts en direct, ils restent jouables.
    add_header Content-Security-Policy "frame-ancestors 'self' https://premadelab.eu https://dev.premadelab.eu" always;
    add_header X-Content-Type-Options nosniff always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "frame-ancestors 'self' https://premadelab.eu https://dev.premadelab.eu" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # /ABCD : le code du salon est lu par la page.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "frame-ancestors 'self' https://premadelab.eu https://dev.premadelab.eu" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri /index.html;
    }
}
